# Your global mise config: install.sh links it to ~/.config/mise/config.toml.
# (Not named mise/config.toml: mise would also load that as a project config inside
# ~/.dotfiles, and ask to trust it.) Configs add their own tools through
# ~/.config/mise/conf.d/, e.g. nvim-config/mise/nvim.toml. Projects that need other versions
# pin them themselves (.python-version, or an untracked mise.local.toml).
[tools]
node = "lts"
# A minor version, not "latest": Mason's Python tools are venvs tied to it, so bump it on
# purpose, then run nvim-config/install.sh --update to rebuild them
python = "3.15"

# Command line tools, the same on macOS and Fedora. Without mise, install.sh gets them from
# Homebrew or dnf instead (step_runtimes). fzf, zoxide and bat are zsh-config's (mise/zsh.toml),
# fd and ripgrep nvim-config's (mise/nvim.toml).
jq = "latest"
kubectl = "latest"
pnpm = "latest"          # projects pin their own (packageManager in package.json)
cargo-binstall = "latest"
maven = "latest"         # needs Java, which nvim-config's mise/nvim.toml brings
# Docker engine in a VM, no Docker Desktop needed. Its VMs live in ~/.colima, apart from the
# binaries. The docker CLI itself comes from Homebrew (with buildx and compose as plugins);
# on Linux, lima also needs QEMU from the package manager.
colima = "latest"
lima = "latest"
lazydocker = "latest"    # a terminal UI for colima's containers
uv = "latest"
"pipx:pgcli" = "latest" # not in mise's registry; a Python tool, so it's tied to the Python above

[settings]
idiomatic_version_file_enable_tools = ["python"]

[settings.self_update]
auto = true

# Global tasks, run from any folder: `mise run update`, or one part of it (`mise tasks` lists
# them). The ones that need the dotfiles run in ~/.dotfiles, or $DOTFILES_DIR as with
# bootstrap.sh. (Not found by following the config.toml link: a [vars] exec() for that would
# run on every mise call, the prompt hook included.) The update scripts are in mise/scripts/.

[tasks.update]
description = "Update everything: the dotfiles, system packages, mise tools and Neovim"
run = [
    { task = "update:dotfiles" },
    { task = "update:packages" },
    { task = "update:mise" },
    { task = "update:nvim" },
]

[tasks."update:dotfiles"]
description = "Pull the dotfiles, and each config on the branch it's on (fast-forward only)"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
quiet = true
run = "mise/scripts/update-dotfiles.sh"

[tasks."update:packages"]
description = "Upgrade system packages without asking: the Brewfile on macOS, dnf on Fedora"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
quiet = true
run = "mise/scripts/update-packages.sh"

[tasks."update:mise"]
description = "Update mise itself and the tools it manages, keeping global npm packages"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
quiet = true
run = "mise/scripts/update-mise.sh"

[tasks."update:nvim"]
description = "Update Neovim, its plugins and Mason tools (skipped where Neovim isn't installed)"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
quiet = true
run = "mise/scripts/update-nvim.sh"

[tasks.lint]
description = "shellcheck every shell script in the dotfiles and its configs"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
tools = { shellcheck = "0.11" }
run = '''
{ git ls-files '*.sh'; git submodule foreach --quiet 'git ls-files "*.sh" | sed "s|^|$sm_path/|"'; } |
    xargs shellcheck
'''
