# Your global mise config: install.sh links it to ~/.config/mise/config.toml.
# (Not named mise/config.toml: mise would also load that as a project config inside
# ~/.dotfiles, and ask to trust it.) Configs add their own tools through
# ~/.config/mise/conf.d/, e.g. nvim-config/mise/nvim.toml. Projects that need other versions
# pin them themselves (.python-version, or an untracked mise.local.toml).
[tools]
node = "lts"
# A minor version, not "latest": Mason's Python tools are venvs tied to it, so bump it on
# purpose, then run nvim-config/install.sh --update to rebuild them
python = "3.14"

# Command line tools, the same on macOS and Fedora. Without mise, install.sh gets them from
# Homebrew or dnf instead (step_runtimes). fzf and zoxide are zsh-config's (mise/zsh.toml),
# fd and ripgrep nvim-config's (mise/nvim.toml).
jq = "latest"
kubectl = "latest"
pnpm = "latest"          # projects pin their own (packageManager in package.json)
cargo-binstall = "latest"
maven = "latest"         # needs Java, which nvim-config's mise/nvim.toml brings
# Docker engine in a VM, no Docker Desktop needed. Its VMs live in ~/.colima, apart from the
# binaries. The docker CLI itself comes from Homebrew (with buildx and compose as plugins);
# on Linux, lima also needs QEMU from the package manager.
colima = "latest"
lima = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]

# Global tasks, run from any folder: `mise run update`, or one part of it (`mise tasks` lists
# them). The ones that need the dotfiles run in ~/.dotfiles, or $DOTFILES_DIR as with
# bootstrap.sh. (Not found by following the config.toml link: a [vars] exec() for that would
# run on every mise call, the prompt hook included.)

[tasks.update]
description = "Update everything: the dotfiles, system packages, mise tools and Neovim"
run = [
    { task = "update:dotfiles" },
    { task = "update:packages" },
    { task = "update:mise" },
    { task = "update:nvim" },
]

[tasks."update:dotfiles"]
description = "Pull the dotfiles, and each config on the branch it's on (fast-forward only)"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
run = '''
git pull --ff-only || echo "dotfiles: not pulled (diverged from upstream?)"
# On their own branches, like install.sh does: `git submodule update` would detach them
git submodule foreach --quiet 'git pull --ff-only --quiet || echo "$sm_path: not pulled (no upstream, or diverged)"'
'''

[tasks."update:packages"]
description = "Upgrade system packages without asking: the Brewfile on macOS, dnf on Fedora"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
run = '''
if [ "$(uname)" = Darwin ]; then
    brew update
    # Installs what the Brewfile gained and upgrades what's in it; other formulae stay as they are.
    # brew bundle has no --yes; HOMEBREW_NO_ASK is the one its brew install/upgrade calls follow
    HOMEBREW_NO_ASK=1 brew bundle install --file packages/Brewfile
elif command -v dnf >/dev/null 2>&1; then
    sudo dnf upgrade --refresh --assumeyes
    # The NVIDIA driver (RPM Fusion's akmod-nvidia) is built per kernel, at boot otherwise:
    # build it now for the newest kernel, so the first boot into it doesn't come up without
    # it. akmods skips what's already built, so this is quick when nothing changed.
    if rpm -q akmod-nvidia >/dev/null 2>&1; then
        kernel="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | sort -V | tail -n 1)"
        sudo akmods --kernels "$kernel"
    fi
else
    echo "packages: no Homebrew or dnf here, skipped"
fi
'''

[tasks."update:mise"]
description = "Update mise itself and the tools it manages, keeping global npm packages"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise self-update --yes || echo "mise: no self-update (installed by a package manager?), skipped"

# Global npm packages belong to one exact Node version. mise gives a new Node the ones in
# ~/.default-npm-packages, but not the rest (from a private registry, a tarball, ...), so
# those are packed from the old Node, which `mise upgrade` keeps for a day, and installed again.
old="$(mise where node 2>/dev/null || true)"
mise upgrade
new="$(mise where node 2>/dev/null || true)"
if [[ -n "$old" && -n "$new" && "$old" != "$new" && -d "$old/lib/node_modules" ]]; then
    tmp="$(mktemp -d)"
    for dir in "$old"/lib/node_modules/[!@]* "$old"/lib/node_modules/@*/*; do
        [[ -d "$dir" ]] || continue
        name="${dir#"$old"/lib/node_modules/}"
        [[ "$name" == npm || "$name" == corepack || -d "$new/lib/node_modules/$name" ]] && continue
        echo "node: carrying $name over from $(basename "$old")"
        (cd "$tmp" && "$new/bin/npm" pack --silent "$dir" >/dev/null)
    done
    shopt -s nullglob
    tarballs=("$tmp"/*.tgz)
    if ((${#tarballs[@]})); then "$new/bin/npm" install -g "${tarballs[@]}"; fi
    rm -rf "$tmp"
fi
'''

[tasks."update:nvim"]
description = "Update Neovim, its plugins and Mason tools (skipped where Neovim isn't installed)"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
run = '''
if command -v nvim >/dev/null 2>&1 && [ -x nvim-config/install.sh ]; then
    nvim-config/install.sh --update
fi
'''

[tasks.lint]
description = "shellcheck every shell script in the dotfiles and its configs"
dir = "{{ get_env(name='DOTFILES_DIR', default=env.HOME ~ '/.dotfiles') }}"
tools = { shellcheck = "0.11" }
run = '''
{ git ls-files '*.sh'; git submodule foreach --quiet 'git ls-files "*.sh" | sed "s|^|$sm_path/|"'; } |
    xargs shellcheck
'''
